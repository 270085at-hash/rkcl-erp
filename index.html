<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKCL ERP SYSTEM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
<div id="login-page" class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-sm border border-slate-700">
<h2 class="text-white text-center font-bold text-xl mb-6">RKCL ERP LOGIN</h2>
<form id="loginForm" class="space-y-4">
<input type="text" id="loginUser" required placeholder="Username (admin/dye)" class="w-full p-3 rounded bg-slate-700 text-white border border-slate-600 focus:outline-none">
<input type="password" id="loginPass" required placeholder="Password" class="w-full p-3 rounded bg-slate-700 text-white border border-slate-600 focus:outline-none">
<div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
<button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition">SIGN IN</button>
</form>
</div>
<div id="app-interface" class="hidden text-center p-6 text-white">
<h1 class="text-2xl font-bold">Welcome to RKCL ERP</h1>
<button onclick="auth.signOut(); location.reload();" class="mt-4 bg-red-600 px-4 py-2 rounded">Logout</button>
</div>
<script>
const firebaseConfig = {apiKey: "AIzaSyA2FqJBEEWIKdPvtVxLkhvS5pL7bM7S7vA", authDomain: "erp-software-d0720.firebaseapp.com", projectId: "erp-software-d0720", storageBucket: "erp-software-d0720.firebasestorage.app", messagingSenderId: "1093542483357", appId: "1:1093542483357:web:e843ea3c6651bf87dd0b74"};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const USER_MAP = {'admin': 'admin@rkcl.com', 'dye': 'dye@rkcl.com'};
document.getElementById('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();
const u = document.getElementById('loginUser').value.trim().toLowerCase();
const p = document.getElementById('loginPass').value.trim();
const errEl = document.getElementById('login-error');
if (!USER_MAP[u]) { errEl.innerText = "❌ Invalid Username!"; errEl.classList.remove('hidden'); return; }
try { await auth.signInWithEmailAndPassword(USER_MAP[u], p); } 
catch (error) { errEl.innerText = "❌ Incorrect Password!"; errEl.classList.remove('hidden'); }
});
auth.onAuthStateChanged(user => { if (user) { document.getElementById('login-page').classList.add('hidden'); document.getElementById('app-interface').classList.remove('hidden'); } });
</script>
</body>
</html>
