<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Panel - Dyeing ERP</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f7f6; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; margin: 2px; }
        .block { background-color: #ff9800; color: white; }
        .active { background-color: #4caf50; color: white; }
        .delete { background-color: #f44336; color: white; }
    </style>
</head>
<body>

<h2>ডাইং ERP কন্ট্রোল প্যানেল</h2>
<table>
    <thead>
        <tr>
            <th>ফ্যাক্টরির নাম</th>
            <th>স্ট্যাটাস</th>
            <th>অ্যাকশন</th>
        </tr>
    </thead>
    <tbody id="factoryTable">
        </tbody>
</table>

<script>
    // আপনার অরিজিনাল ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
        apiKey: "AIzaSyBHF_4XEBs_ZLQQnQValqWOFgBG_bxegOo",
        authDomain: "dyeing-erp.firebaseapp.com",
        databaseURL: "https://dyeing-erp-default-rtdb.firebaseio.com",
        projectId: "dyeing-erp",
        storageBucket: "dyeing-erp.firebasestorage.app",
        messagingSenderId: "177578532239",
        appId: "1:177578532239:web:18e331b7e9c0ee12347ffa"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('factories');

    // ডাটা লোড ও রেন্ডার করা
    db.on('value', (snapshot) => {
        const table = document.getElementById('factoryTable');
        table.innerHTML = '';
        
        snapshot.forEach((childSnapshot) => {
            const key = childSnapshot.key;
            const data = childSnapshot.val();
            const status = data.status || 'active'; // ডিফল্ট 'active'

            table.innerHTML += `
                <tr>
                    <td>${data.name || 'নাম নেই'}</td>
                    <td><b>${status.toUpperCase()}</b></td>
                    <td>
                        <button class="btn ${status === 'blocked' ? 'active' : 'block'}" onclick="toggleStatus('${key}', '${status}')">
                            ${status === 'blocked' ? 'আনব্লক' : 'ব্লক'}
                        </button>
                        <button class="btn delete" onclick="deleteFactory('${key}')">ডিলিট</button>
                    </td>
                </tr>
            `;
        });
    });

    // ব্লক/আনব্লক ফাংশন
    function toggleStatus(key, currentStatus) {
        const newStatus = (currentStatus === 'blocked') ? 'active' : 'blocked';
        firebase.database().ref('factories/' + key).update({ status: newStatus })
            .then(() => alert("স্ট্যাটাস পরিবর্তন হয়েছে!"))
            .catch(error => alert("সমস্যা হয়েছে: " + error.message));
    }

    // ডিলিট ফাংশন
    function deleteFactory(key) {
        if(confirm("আপনি কি নিশ্চিতভাবে এই ফ্যাক্টরি ডিলিট করতে চান?")) {
            firebase.database().ref('factories/' + key).remove()
                .then(() => alert("সফলভাবে ডিলিট হয়েছে!"))
                .catch(error => alert("ডিলিট করতে সমস্যা হয়েছে!"));
        }
    }
</script>

</body>
</html>
